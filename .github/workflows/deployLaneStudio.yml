name: Deploy LaneStudio to server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Get latest code
        uses: actions/checkout@v6
        with:
          ref: mm/lane-studio-main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # builds iD's assets, then packages Lane Studio as the whole site in dist-lanes/
      - name: Build Lane Studio
        run: npm run all
        env:
          # logging in to OpenStreetMap from your own domain needs your own OAuth 2 application,
          # registered at https://www.openstreetmap.org/oauth2/applications with the redirect URI
          # https://<your domain>/land.html; put its client ID in the repository variable OSM_CLIENT_ID
          ID_API_CONNECTION_URL: ${{ vars.OSM_CLIENT_ID && 'https://www.openstreetmap.org' || '' }}
          ID_API_CONNECTION_API_URL: ${{ vars.OSM_CLIENT_ID && 'https://api.openstreetmap.org' || '' }}
          ID_API_CONNECTION_CLIENT_ID: ${{ vars.OSM_CLIENT_ID }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist-lanes/
