name: 'Lane Studio: Bug'
description: Something in Lane Studio is drawn, routed or edited wrongly, or doesn't work.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Lane Studio works everything out from the OSM tags,
        so the location and an export of the area are usually what it takes to reproduce a problem.
  - type: input
    id: url
    attributes:
      label: URL
      description: The address from your browser, which holds the map location (`#map=zoom/lat/lon`).
      placeholder: https://…/#map=19.00/52.98216/-0.01743
    validations:
      required: false
  - type: input
    id: ids
    attributes:
      label: OSM ids
      description: The roads, nodes or relations involved, if you know them.
      placeholder: "w30170101, n8968432222"
    validations:
      required: false
  - type: textarea
    id: steps-reproduce
    attributes:
      label: What happened, and what did you expect?
      description: The steps to see it, and what should happen instead.
      placeholder: 1. …, 2. …, 3. …
    validations:
      required: true
  - type: textarea
    attributes:
      label: Screenshots and data
      description: |
        Screenshots help most with your expected result drawn on them. For drawing, junction or routing
        problems, attach an export of the area: openstreetmap.org → Export → Manually select a different
        area → Export, then rename the file to `.osm.txt` if GitHub refuses it.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      description: Bottom right of the map.
      placeholder: "v26.10.27"
    validations:
      required: false
  - type: dropdown
    id: browsers
    attributes:
      label: Which browsers are you seeing this problem on?
      multiple: true
      options:
        - Chrome
        - Firefox
        - Microsoft Edge
        - Opera
        - Safari
        - Vivaldi
        - Other (please specify)
    validations:
      required: false
