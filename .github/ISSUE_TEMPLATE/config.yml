blank_issues_enabled: true
contact_links:
  - name: There is an issue with presets or OSM tagging suggestions
    url: https://github.com/openstreetmap/id-tagging-schema/issues
    about: Presets and fields come from iD's tagging schema; please report them there.
  - name: There is an issue with brand icons or brand tagging suggestions
    url: https://github.com/osmlab/name-suggestion-index/issues
    about: Please create a feature request in the name-suggestion-index repository.
  - name: There is an issue with a background imagery source
    url: https://github.com/osmlab/editor-layer-index/issues
    about: Please create an issue in the editor-layer-index repository.
  - name: There is an issue with iD itself (not lanes or road drawing)
    url: https://github.com/openstreetmap/iD/issues
    about: If it happens in plain iD on openstreetmap.org too, please report it to iD.
