<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img"
     aria-label="Illustration of the Lane Studio editor: a selected carriageway on a map with per-lane turn arrows, and a side panel showing the lane list and the OpenStreetMap tags it writes.">
  <title>Lane Studio editor, illustrated</title>

  <!-- Window -->
  <rect x="0.5" y="0.5" width="719" height="479" rx="14" fill="#0e0e0e" stroke="#2a2a2a"/>
  <clipPath id="window">
    <rect x="1" y="1" width="718" height="478" rx="13.5"/>
  </clipPath>

  <g clip-path="url(#window)">
    <!-- Map canvas -->
    <rect x="0" y="40" width="480" height="440" fill="#121212"/>

    <!-- Faint grid -->
    <g stroke="#1b1b1b" stroke-width="1">
      <path d="M48 40V480M96 40V480M144 40V480M192 40V480M240 40V480M288 40V480M336 40V480M384 40V480M432 40V480"/>
      <path d="M0 88h480M0 136h480M0 184h480M0 232h480M0 280h480M0 328h480M0 376h480M0 424h480"/>
    </g>

    <!-- Minor roads: casing then surface -->
    <g fill="none" stroke-linecap="round">
      <path d="M-10 150H490" stroke="#242424" stroke-width="15"/>
      <path d="M-10 150H490" stroke="#363636" stroke-width="10"/>

      <path d="M-10 392H490" stroke="#242424" stroke-width="13"/>
      <path d="M-10 392H490" stroke="#333" stroke-width="8"/>

      <path d="M40 480 150 352" stroke="#242424" stroke-width="12"/>
      <path d="M40 480 150 352" stroke="#303030" stroke-width="7"/>

      <path d="M360 40v110" stroke="#242424" stroke-width="12"/>
      <path d="M360 40v110" stroke="#303030" stroke-width="7"/>
    </g>

    <!-- Selected carriageway -->
    <g fill="none" stroke-linecap="butt">
      <path d="M250 40V480" stroke="#2b2b2b" stroke-width="56"/>
      <path d="M250 40V480" stroke="#343434" stroke-width="48"/>
      <!-- Lane dividers -->
      <g stroke="#5a5a5a" stroke-width="1.5" stroke-dasharray="9 11">
        <path d="M242 40V480"/>
        <path d="M258 40V480"/>
      </g>
      <!-- Selection highlight along the way -->
      <path d="M250 40V480" stroke="#ff922b" stroke-width="2.5"/>
    </g>

    <!-- Way vertices, iD-style handles -->
    <g fill="#121212" stroke="#ff922b" stroke-width="2">
      <circle cx="250" cy="150" r="5"/>
      <circle cx="250" cy="392" r="5"/>
      <circle cx="250" cy="270" r="4"/>
    </g>

    <!-- Per-lane turn arrows, pointing in the direction of travel -->
    <g stroke="#ff922b" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- left lane: left turn -->
      <g transform="translate(234 232)">
        <path d="M0 24V10q0-7-7-7h-5"/>
        <path d="m-9 -1-4 4 4 4"/>
      </g>
      <!-- centre lane: through -->
      <g transform="translate(250 232)">
        <path d="M0 24V2"/>
        <path d="m-4 6 4-5 4 5"/>
      </g>
      <!-- right lane: right turn -->
      <g transform="translate(266 232)">
        <path d="M0 24V10q0-7 7-7h5"/>
        <path d="m9 -1 4 4-4 4"/>
      </g>
    </g>

    <!-- Scale chip -->
    <g>
      <rect x="16" y="440" width="86" height="24" rx="7" fill="#1a1a1a" stroke="#2a2a2a"/>
      <path d="M26 452h30" stroke="#6a6a6a" stroke-width="1.5"/>
      <path d="M26 448v8M56 448v8" stroke="#6a6a6a" stroke-width="1.5"/>
      <text x="64" y="456" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#6a6a6a">50 m</text>
    </g>

    <!-- Side panel -->
    <rect x="480" y="40" width="240" height="440" fill="#151515"/>
    <path d="M480.5 40v440" stroke="#2a2a2a"/>

    <text x="500" y="70" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600"
          letter-spacing="0.08em" fill="#6a6a6a">LANES · FORWARD</text>

    <!-- Lane rows -->
    <g font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="#e8e8e8">
      <g>
        <rect x="498.5" y="84.5" width="203" height="40" rx="9" fill="#1d1d1d" stroke="#2d2d2d"/>
        <g transform="translate(518 96)" stroke="#ff922b" stroke-width="1.8" fill="none"
           stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 17V7q0-5-5-5h-3"/>
          <path d="m-5 -1-3 3 3 3"/>
        </g>
        <text x="542" y="109">Left turn</text>
      </g>
      <g>
        <rect x="498.5" y="132.5" width="203" height="40" rx="9" fill="#1d1d1d" stroke="#2d2d2d"/>
        <g transform="translate(518 144)" stroke="#ff922b" stroke-width="1.8" fill="none"
           stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 17V2"/>
          <path d="m-3 5 3-4 3 4"/>
        </g>
        <text x="542" y="157">Through</text>
      </g>
      <g>
        <rect x="498.5" y="180.5" width="203" height="40" rx="9" fill="#1d1d1d" stroke="#2d2d2d"/>
        <g transform="translate(518 192)" stroke="#ff922b" stroke-width="1.8" fill="none"
           stroke-linecap="round" stroke-linejoin="round">
          <path d="M0 17V7q0-5 5-5h3"/>
          <path d="m5 -1 3 3-3 3"/>
        </g>
        <text x="542" y="205">Right turn</text>
      </g>
    </g>

    <!-- Add lane affordance -->
    <g>
      <rect x="498.5" y="228.5" width="203" height="34" rx="9" fill="none" stroke="#2d2d2d"
            stroke-dasharray="5 5"/>
      <path d="M592 245.5h16M600 237.5v16" stroke="#6a6a6a" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <!-- Generated tags -->
    <text x="500" y="298" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600"
          letter-spacing="0.08em" fill="#6a6a6a">TAGS WRITTEN</text>
    <rect x="498.5" y="310.5" width="203" height="112" rx="9" fill="#101010" stroke="#2a2a2a"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5">
      <text x="512" y="332" fill="#9b9b9b">lanes<tspan fill="#5e5e5e">=</tspan><tspan fill="#ff922b">3</tspan></text>
      <text x="512" y="352" fill="#9b9b9b">oneway<tspan fill="#5e5e5e">=</tspan><tspan fill="#ff922b">yes</tspan></text>
      <text x="512" y="372" fill="#9b9b9b">turn:lanes<tspan fill="#5e5e5e">=</tspan></text>
      <text x="524" y="390" fill="#ff922b">left|through|right</text>
      <text x="512" y="410" fill="#9b9b9b">width<tspan fill="#5e5e5e">=</tspan><tspan fill="#ff922b">9.5</tspan></text>
    </g>

    <!-- Toolbar -->
    <rect x="0" y="0" width="720" height="40" fill="#161616"/>
    <path d="M0 39.5h720" stroke="#2a2a2a"/>
    <g fill="#2e2e2e">
      <circle cx="20" cy="20" r="4.5"/>
      <circle cx="37" cy="20" r="4.5"/>
      <circle cx="54" cy="20" r="4.5"/>
    </g>
    <g fill="#1f1f1f" stroke="#2a2a2a">
      <rect x="80.5" y="10.5" width="30" height="20" rx="6"/>
      <rect x="116.5" y="10.5" width="30" height="20" rx="6"/>
      <rect x="152.5" y="10.5" width="30" height="20" rx="6"/>
    </g>
    <g stroke="#7a7a7a" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="m91 25 4-10 2 6 4 1z"/>
      <path d="M126 25v-9M126 16h10"/>
      <path d="M159 20h11M164.5 15v10"/>
    </g>
    <rect x="636.5" y="9.5" width="66" height="22" rx="7" fill="#2a1b08" stroke="#4a3310"/>
    <text x="669.5" y="24.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif"
          font-size="11" font-weight="600" fill="#ff922b">Upload</text>
  </g>
</svg>
