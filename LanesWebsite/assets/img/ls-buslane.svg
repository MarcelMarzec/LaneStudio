<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img"
     aria-label="Illustration of a carriageway cross-section with a bus lane and a cycle lane picked out from the general traffic lanes.">
  <title>Bus and cycle lanes on a carriageway</title>
  <rect width="400" height="260" fill="#121212"/>
  <g stroke="#1b1b1b" stroke-width="1">
    <path d="M0 52h400M0 104h400M0 156h400M0 208h400"/>
  </g>

  <!-- Carriageway running left to right -->
  <path d="M0 130h400" stroke="#2b2b2b" stroke-width="104" fill="none"/>
  <path d="M0 130h400" stroke="#343434" stroke-width="96" fill="none"/>

  <!-- Bus lane, picked out -->
  <path d="M0 102h400" stroke="#ff922b" stroke-width="24" stroke-opacity="0.16" fill="none"/>
  <path d="M0 90.5h400M0 113.5h400" stroke="#ff922b" stroke-width="1.6" stroke-opacity="0.6" fill="none"/>

  <!-- Cycle lane -->
  <path d="M0 166h400" stroke="#ff922b" stroke-width="14" stroke-opacity="0.1" fill="none"/>
  <path d="M0 159.5h400M0 172.5h400" stroke="#ff922b" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>

  <!-- Lane dividers -->
  <g stroke="#5a5a5a" stroke-width="1.4" stroke-dasharray="11 13" fill="none">
    <path d="M0 136h400"/>
  </g>
  <path d="M0 150h400" stroke="#6a6a6a" stroke-width="1.2" fill="none"/>

  <!-- Edge lines -->
  <g stroke="#d8d8d8" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M0 80h400"/>
    <path d="M0 180h400"/>
  </g>

  <!-- Bus glyph -->
  <g transform="translate(96 102)" stroke="#ff922b" stroke-width="1.8" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <rect x="-16" y="-8" width="32" height="16" rx="3"/>
    <path d="M-16 -1h32"/>
    <circle cx="-9" cy="10" r="2"/>
    <circle cx="9" cy="10" r="2"/>
  </g>

  <!-- Cycle glyph -->
  <g transform="translate(96 166)" stroke="#ff922b" stroke-width="1.6" fill="none"
     stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.85">
    <circle cx="-8" cy="2" r="4.5"/>
    <circle cx="9" cy="2" r="4.5"/>
    <path d="m-8 2 5-8h6l4 8M-3 -6h7"/>
  </g>

  <!-- Labels. The centre label carries a halo so the lane divider does not
       run through the lettering. -->
  <g font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600">
    <text x="156" y="106" fill="#ff922b">bus lane</text>
    <text x="156" y="170" fill="#ff922b" fill-opacity="0.8">cycleway</text>
    <rect x="150" y="131" width="84" height="15" rx="3" fill="#343434"/>
    <text x="156" y="142" fill="#8a8a8a">general traffic</text>
  </g>

  <!-- Tag strip -->
  <g>
    <rect x="16.5" y="208.5" width="368" height="36" rx="9" fill="#101010" stroke="#2a2a2a"/>
    <text x="30" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10"
          fill="#9b9b9b">
      busway:left<tspan fill="#5e5e5e">=</tspan><tspan fill="#ff922b">lane</tspan>
      <tspan dx="14">cycleway:right</tspan><tspan fill="#5e5e5e">=</tspan><tspan fill="#ff922b">track</tspan>
    </text>
  </g>
</svg>
