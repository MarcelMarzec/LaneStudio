<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260" role="img"
     aria-label="Illustration of a crossroads with a three-lane approach, each lane marked with its own turn arrow.">
  <title>Turn lanes on a junction approach</title>
  <rect width="400" height="260" fill="#121212"/>
  <g stroke="#1b1b1b" stroke-width="1">
    <path d="M50 0v260M150 0v260M250 0v260M350 0v260"/>
    <path d="M0 52h400M0 104h400M0 156h400M0 208h400"/>
  </g>

  <!-- Crossing road -->
  <path d="M0 78h400" stroke="#242424" stroke-width="34" fill="none"/>
  <path d="M0 78h400" stroke="#333" stroke-width="28" fill="none"/>
  <path d="M0 78h400" stroke="#555" stroke-width="1.4" stroke-dasharray="10 12" fill="none"/>

  <!-- Approach carriageway -->
  <path d="M200 260V78" stroke="#2b2b2b" stroke-width="62" fill="none"/>
  <path d="M200 260V78" stroke="#343434" stroke-width="54" fill="none"/>
  <g stroke="#5a5a5a" stroke-width="1.4" stroke-dasharray="9 11" fill="none">
    <path d="M191 260V96"/>
    <path d="M209 260V96"/>
  </g>
  <path d="M200 260V78" stroke="#ff922b" stroke-width="2.2" fill="none"/>
  <circle cx="200" cy="78" r="5" fill="#121212" stroke="#ff922b" stroke-width="2"/>

  <!-- Stop line -->
  <path d="M174 100h52" stroke="#d8d8d8" stroke-width="3" stroke-opacity="0.5"/>

  <!-- Lane arrows -->
  <g stroke="#ff922b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(182 136)">
      <path d="M0 32V14q0-8-8-8h-6"/>
      <path d="m-11 1-5 5 5 5"/>
    </g>
    <g transform="translate(200 136)">
      <path d="M0 32V4"/>
      <path d="m-5 9 5-6 5 6"/>
    </g>
    <g transform="translate(218 136)">
      <path d="M0 32V14q0-8 8-8h6"/>
      <path d="m11 1 5 5-5 5"/>
    </g>
  </g>

  <!-- Callout -->
  <g>
    <rect x="252.5" y="178.5" width="130" height="58" rx="10" fill="#1a1a1a" stroke="#2d2d2d"/>
    <text x="266" y="200" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600"
          fill="#e8e8e8">3 lanes forward</text>
    <text x="266" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5"
          fill="#ff922b">left|through|right</text>
    <path d="M252 206 228 198" stroke="#2d2d2d" stroke-width="1.5"/>
  </g>
</svg>
