<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8'>
    <title>Lane Studio</title>
    <link rel='stylesheet' href='dist/iD.css'>
    <link rel='stylesheet' href='dist/lanes.css'>
    <link rel='icon' type='image/svg+xml' href='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%232b313b%22%2F%3E%3Cpath%20d%3D%22M11%203v26M21%203v26%22%20stroke%3D%22%23fff%22%20stroke-width%3D%221.5%22%20stroke-dasharray%3D%223%202.6%22%20opacity%3D%220.8%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%235cc8ff%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M16%2026V8M12.6%2011.4%2016%208l3.4%203.4%22%2F%3E%3Cpath%20d%3D%22M6.5%2026v-9L3.2%2012.5M3%2016.1l.2-3.6%203.5.85%22%2F%3E%3Cpath%20d%3D%22M25.5%2026v-9l3.3-4.5M29%2016.1l-.2-3.6-3.5.85%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no'/>
    <meta name='mobile-web-app-capable' content='yes'/>
    <meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'/>
    <style type='text/css'>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        /* disable elastic page bounce upon scroll */
        overflow: hidden;
      }
      @media (prefers-color-scheme: dark) {
        body {
          /* start with dark background while loading page in dark mode */
          background-color: #212529;
        }
      }
    </style>
  </head>

  <body>
    <div id='id-container'></div>

    <script>
      var container = document.getElementById('id-container');
      var newScript = document.createElement('script');
      newScript.type = 'text/javascript';
      newScript.onload = checkScript;
      newScript.onerror = checkScript;
      newScript.src = 'dist/lanes.js';

      document.getElementsByTagName('head')[0].appendChild(newScript);


      function checkScript() {
        if (typeof LaneStudio === 'undefined' || !iD.utilDetect().support) {
          container.innerHTML = 'Sorry, your browser is not currently supported. Please use another <a href="https://github.com/openstreetmap/iD#basics">browser</a> or <a href="https://wiki.openstreetmap.org/wiki/Editors">editor</a> to contribute to the map.';
          container.style.padding = '20px';

        } else {
          var context = LaneStudio.init(container, { assetPath: 'dist/' });
          window.context = window.id = context;  // for debugging
        }
      }
    </script>
  </body>
</html>
