# English strings for Lane Studio, read as `t('_lanes.<key>')`.
en:
  app:
    name: Lane Studio
  section:
    title: Lanes
    summary:
      oneway: "{n} lanes, one way"
      twoway: "{forward} forward, {backward} backward"
      both_ways: "{n} both ways"
    assumed: Lane count assumed from the road type; nothing is written until you change it.
    no_markings: No lane markings
    counts:
      forward: Forward
      backward: Backward
      both_ways: Both ways (centre)
      lanes: Lanes
      add: Add a lane
      remove: Remove the outer lane
    strip_hint: Click a lane here or on the map to edit it.
  direction:
    forward: Forward
    backward: Backward
    both_ways: Both ways
  inspector:
    title: "Lane {n} of {total}"
    title_multi: "{n} lanes selected"
    direction: Direction of travel
    turn: Turn arrows
    change: Lane change allowed
    change_left: To the left
    change_right: To the right
    kind: Lane type
    remove: Remove this lane
    order: Position
    move_left: ← Move left
    move_right: Move right →
    mixed: Mixed
    readonly: "{key} is kept as tagged because its values do not match the lanes. Fix it in the tag editor."
    other_keys: Other lane tags
  tools:
    select: Select
    select_tip: Click lanes to edit them
    paint: Paint
    paint_tip: Pick a value, then click lanes on the map to apply it
    paint_hint: Click lanes on the map to apply this value. Each click is one undo step.
    width: Width
    width_tip: Drag lane lines and kerbs of the selected road to set lane widths
    width_hint: Drag a lane line or kerb of the selected road. Widths are written to width:lanes in metres.
    marking: Markings
    connect: Connect
    connect_tip: Connect a lane to a lane on the next road, for junctions where lanes do not simply carry on
    marking_tip: Place crossings, stop and give way signs, signals and traffic calming by clicking a road
  change:
    "yes": Change allowed both ways
    "no": No lane change
    not_left: Not to the left
    not_right: Not to the right
  kind:
    general: General traffic
    bus: Bus lane
    psv: Public transport (PSV)
    taxi: Taxi lane
    hov: HOV lane
    bicycle: Bicycle lane
    pedestrian: Pedestrian lane
    restricted: No access
  turn:
    sharp_left: Sharp left
    left: Left
    slight_left: Slight left
    through: Through
    slight_right: Slight right
    right: Right
    sharp_right: Sharp right
    reverse: U-turn
    merge_to_left: Merge left
    merge_to_right: Merge right
    none: No arrow
  field:
    maxspeed: Speed limit
    minspeed: Minimum speed
    destination: Destination
    destination_ref: Destination road number
    access: Access
    width: Width (m)
    maxwidth: Width limit
    maxheight: Height limit
    surface: Surface
  issue:
    count_mismatch: "{key} has {actual} values for {expected} lanes."
    direction_counts_mismatch: "Forward, backward and centre lanes add up to {actual}, but lanes is {expected}."
    ambiguous_direction_counts: An odd number of lanes on a two-way road; add lanes:forward and lanes:backward.
    mixed_key_styles: "{key} is tagged both with and without a direction."
    invalid_lane_count: "{key} is not a whole number."
    key_not_updated: "{key} was not updated for the new lane count."
  markings:
    title: Road markings
    type: What is here
    types:
      none: Nothing
      crossing: Crossing
      stop: Stop
      give_way: Give way
      traffic_signals: Traffic signals
      calming: Traffic calming
      mini_roundabout: Mini-roundabout
    crossing_markings: Crossing markings
    crossing:
      zebra: Zebra
      lines: Lines
      dots: Dots
      "no": Unmarked
      signals: Traffic signals
      island: Traffic island in the middle
    direction: Applies to traffic travelling
    directions:
      forward: Along the road
      backward: Against the road
      both: Both ways
    direction_hint: '"Along the road" is the way''s drawing direction, shown by iD''s direction arrows.'
    all_way_stop: All-way stop
    calming: Type
    calming_types:
      bump: Bump
      hump: Hump
      table: Table
      cushion: Cushion
      rumble_strip: Rumble strip
      chicane: Chicane
      choker: Choker
    place: Place on the map
    place_tip: Choose what to place, then click a road on the map
    placing: "Click a road to place a {type}."
    stop_placing: Stop placing
  connect:
    pick_from: Click the lane traffic comes from, near the junction.
    pick_to: Now click the lane on the next road it leads to. Clicking the same pair again removes the connection.
    same_road: Pick a lane on another road.
    not_joined: These roads do not meet at an end node. Split the roads at the junction first.
    wrong_direction: Traffic in the first lane cannot drive into the second lane here.
  roundabout:
    title: Roundabout
    summary: "This ring has {segments} segments and {approaches} roads joining it."
    turbo: Turbo roundabout (this segment)
    turbo_hint: "Sets roundabout=turbo and change:lanes=no on this segment. Tag every ring segment, one at a time."
    untagged: "{n} of {total} ring segments are not tagged as turbo."
    select_next: Select the next one
    restrictions: "{n} turn restrictions found; a standard turbo roundabout needs {needed}. Add missing ones with the Turn Restrictions field on the junction nodes."
    spiral: Spiral roundabouts have no tagging scheme of their own; use turn lanes, change:lanes=no and lane connections.
  lookahead:
    title: Look ahead
    limit: "Roads: "
    travelling_forward: Following the road in its drawing direction. Select a backward lane to look the other way.
    travelling_backward: Following the road against its drawing direction.
    unnamed: Unnamed road
    exits: Exits at the end of this road
    use_turn: Turn
    use_turn_tip: Add this turn to the selected lanes' arrows
    use_destination: Destination
    use_destination_tip: Use this exit's sign text as the selected lanes' destination; check it against the real sign
    select_lanes: Select lanes to use an exit's turn or destination.
    copy: "Copy lanes to {road}"
    copy_tip: Copies lane counts and lane tags (not turn or destination lanes) onto the next road, as one undo step
  roadside:
    title: Roadside
    hint: Left and right are as seen looking along the way's drawing direction.
    left: Left side
    right: Right side
    sidewalk: Pavement
    cycleway: Cycleway
    parking: Parking
    unknown: Not tagged
    values:
      "yes": "Yes"
      "no": "No"
      separate: Mapped separately
      lane: Lane on the road
      track: Track
      shared_lane: Shared lane
      street_side: Beside the road
      half_on_kerb: Half on the kerb
      on_kerb: On the kerb
    separate_found: "A pavement is mapped separately on the {side}."
    use_separate: Set to "mapped separately"
    double_mapped: "The {side} pavement is tagged on the road and also mapped separately; tag it as mapped separately instead."
    kerb_width: "Mapped kerbs are {width} m apart."
    set_width: "Set width={width}"
    islands:
      one: "{n} traffic island is mapped on this road."
      other: "{n} traffic islands are mapped on this road."
  annotation:
    marking: Changed a road marking.
    roadside: Changed the roadside.
    copy: Copied lanes to the next road.
    connect: Changed lane connections.
    roundabout: Changed a roundabout.
    add_lane: Added a lane.
    remove_lane: Removed a lane.
    move_lane: Changed a lane's direction.
    turn: Changed turn lanes.
    change: Changed lane markings.
    kind: Changed a lane's type.
    value: Changed a lane's tags.
    width: Changed lane widths.
