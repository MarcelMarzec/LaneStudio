    unknown_turn_reference: "Turn values are left, slight_left, sharp_left, through, right, slight_right, sharp_right, reverse, merge_to_left, merge_to_right, slide_left, slide_right, next_left, next_right and none."
    fix_unknown_turn: "Change \"{value}\" to \"{replacement}\""
    deprecated_change: "{feature} uses the deprecated lane change value \"{value}\"."
    fix_deprecated_change: "Change \"{value}\" to \"{replacement}\""
    hov_lane: "{feature} has hov=lane, which is deprecated."
    hov_lane_reference: Mark the HOV lanes with hov:lanes=designated|… instead, using the Lanes section.
    destination_twoway: "{feature} has destination on a two-way road."
    destination_twoway_reference: Use destination:forward or destination:backward on two-way roads.
    width_too_narrow: "{feature} has width={width}, narrower than its lanes' widths add up to ({lanes} m)."
    width_too_narrow_reference: "width is the carriageway from kerb to kerb, so it is at least the lanes' widths (width:lanes) added up. One of them is wrong."
    lanes_bus_unmarked: "{feature} has {key}, but {n} of those bus lanes are not marked on a lane."
    lanes_bus_unmarked_reference: "lanes:bus says how many bus lanes there are; bus:lanes says which lanes they are. Mark them in the Lanes section."
    fix_lanes_bus_unmarked: Mark the kerb-side lanes as bus lanes
    old_cycleway: "{feature} uses the old opposite_* cycleway values."
    old_cycleway_reference: "A contraflow cycle lane is cycleway:<side>=lane with cycleway:<side>:oneway=-1, and oneway:bicycle=no lets cycles ride both ways."
    fix_old_cycleway: Upgrade to cycleway:<side> and oneway:bicycle
    old_busway: "{feature} tags its bus lanes the old way (busway=lane)."
    old_busway_reference: "Bus lanes are lanes of their own, marked with bus:lanes=designated (and counted in lanes)."
    fix_old_busway: Make them lanes of their own
    turn_dead_end: "{feature} has lanes turning off at an end no other road joins."
    turn_dead_end_reference: "turn:lanes describes the turns at the end of the road, where it meets the roads it turns into. Check the arrows, or whether the road is joined to the next one."
    merge_never_ends: "{feature} has a merging lane, but the road it leads on to has as many lanes."
    merge_never_ends_reference: "merge_to_left and merge_to_right mark a lane that ends: the road after it has one lane fewer, or carries on merging."

