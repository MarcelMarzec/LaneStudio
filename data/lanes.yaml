  info_link: "{page} on the OpenStreetMap wiki"
  info:
    advisory: "The speed advised on a plate below a warning sign (maxspeed:advisory), such as on a bend: not a limit. Type a number for any other speed."
    structure: "What the road is on or in: a bridge or viaduct (bridge=*), a tunnel or a passage through a building (tunnel=*), an embankment, a cutting, a ford or a covered way. A bridge or tunnel also gets a layer."
    access: "Who may use the lane (access:lanes): yes, no, designated, destination and so on, one value per lane."
    camera: "A speed camera or red light camera (highway=speed_camera); the limit it enforces is its maxspeed, and direction is the way it faces."
    centre_line: "The line between traffic going opposite ways. Dashed where either way may overtake; a double white line is solid on the side of the traffic that may not cross it (overtaking=*, overtaking:forward, overtaking:backward)."
    change: "Whether traffic may change into the lane beside it (change:lanes: yes, no, not_left, not_right). Beside the centre line this is overtaking (overtaking=*); beside the kerb there is nothing to change into."
    cycleway: "Cycle lanes and tracks along the road, per side (cycleway:left, cycleway:right): a lane is painted on the road, inside the kerb, a track is kept apart from it. Their width is cycleway:<side>:width. A contraflow lane is cycleway:<side>=lane with cycleway:<side>:oneway=-1 and oneway:bicycle=no, not the old opposite_lane. Each side's details (the line beside it, direction, width, buffer, separation, colour) fold away under the field."
    destination: "Where a lane goes, as the signs say (destination:lanes); several places are separated by semicolons. Lanes with none take the road's destination:forward or destination:backward (destination on a one-way road)."
    destination_ref: "The road numbers on the signs for a lane (destination:ref:lanes), such as M6 or A38."
    destination_street: "The street a lane leads to, as the signs name it (destination:street:lanes)."
    destination_int_ref: "The European road numbers on the signs for a lane (destination:int_ref:lanes), such as E15."
    destination_arrow: "Which way the arrow on the sign for a lane points (destination:arrow:lanes): left, right, through and the like."
    destination_country: "The country a lane leads to, as the sign's country code shows (destination:country:lanes), such as F or NL."
    destination_symbol: "Symbols on the sign for a lane (destination:symbol:lanes): airport, hospital, motorway, centre and the like."
    width_start_end: "A lane that widens or narrows along the road: its width where the way starts (width:lanes:start) and where it ends (width:lanes:end). The lane is drawn changing evenly between them."
    toll: "Whether a lane is tolled (toll:lanes=yes|no), as at a toll plaza."
    payment: "How a lane's toll is paid (payment:cash:lanes, payment:cards:lanes = yes or no per lane)."
    conditional: "A lane's value at certain times or for certain vehicles, as value @ (condition) (wiki: Conditional restrictions), such as no @ (Mo-Fr 07:00-10:00) or 50 mph @ (wet). Several are separated by semicolons. Written into the road's access:lanes:conditional or maxspeed:lanes:conditional, one list per condition."
    direction: "Which way the lane's traffic goes: forward (along the way's drawing direction), backward, or both ways for a centre turn lane (lanes:forward, lanes:backward, lanes:both_ways)."
    island_surface: "A traffic island mapped as an area (area:highway=traffic_island). Its surface sets its colour; untagged islands are drawn as concrete."
    kerb: "The kerb round the island (barrier=kerb with kerb=raised, lowered, flush or rolled)."
    kind: "What the lane is for: a bus lane is bus:lanes=designated, a cycle lane bicycle:lanes=designated, a variable lane access:lanes=variable, and so on. A lane closed to other traffic (access:lanes=no) and open to buses (bus:lanes=yes) is a bus lane too."
    lane_minspeed: "The selected lanes' own minimum speed (minspeed:lanes). Lanes with none of their own follow the road's."
    lane_speed: "The selected lanes' own speed limit (maxspeed:lanes, and maxspeed:type:lanes for a UK limit type). Lanes with none of their own follow the road's."
    lane_strip: "The road's lanes, left to right as the way is drawn, with their turn arrows and colours by lane type. Click a lane to edit it; shift-click to pick more."
    lanes: "How many traffic lanes the road has: lanes, and on two-way roads lanes:forward, lanes:backward and lanes:both_ways. Parking, hard shoulders and cycle lanes are not counted."
    lookahead: "The roads this one leads on to, with their lanes and the exits at its end. A turn or destination from an exit is only written to the selected lanes when you click it."
    managed: "Smart motorways and other roads where signs change the limit or open a lane (active_traffic_management=yes). All lanes running has no hard shoulder (shoulder=no); a dynamic hard shoulder is a lane opened by signs (access:lanes=…|variable)."
    marking_tool: "Click a road to put a crossing, stop or give way line, traffic signals, traffic calming, a mini-roundabout, a passing place or an emergency bay on it, as a node with that feature's tags."
    maxheight: "The tallest vehicle the lane takes (maxheight:lanes), in metres or feet and inches."
    maxspeed: "The road's speed limit (maxspeed). In the UK the national limit, motorway limit, restricted road and 20 zone are signs of their own, written with maxspeed:type."
    maxweight: "The heaviest vehicle the lane takes (maxweight:lanes), in tonnes."
    maxwidth: "The widest vehicle the lane takes (maxwidth:lanes), in metres or feet and inches."
    minspeed: "The lowest speed allowed on the road (minspeed), signed with blue roundels."
    other_keys: "Lane tags on the road that Lane Studio has no field of its own for, so nothing is hidden: one value per lane, separated by |."
    paint: "Pick what to paint and its value, then click lanes on the map: each click writes it to that lane as one undo step."
    parking: "Where cars park on each side (parking:left, parking:right, parking:both): on the road, beside it in bays, half or fully on the pavement, on the shoulder, mapped separately, or no parking."
    parking_access: "Who may park (parking:<side>:access): anyone, permit holders only (private), customers, deliveries or nobody."
    parking_capacity: "How many cars the parking holds (capacity). Usually left out on a road, as it can be worked out from the road's length."
    parking_charge: "What it costs (charge), such as 1.50 GBP/hour."
    parking_direction: "Which way cars must face in the bays (parking:<side>:direction): back_in for reversed diagonal parking, head_in where signs say so."
    parking_disabled: "Bays kept for disabled drivers (disabled=designated)."
    parking_disc: "A parking disc shows when you arrived (authentication:disc=yes)."
    parking_fee: "Whether you pay to park (fee=yes or no). Pay at times is written as fee:conditional, such as no @ (Su)."
    parking_markings: "Whether the bays are painted (parking:<side>:markings). Without markings no bay lines are drawn."
    parking_maxstay: "How long you may park (maxstay), such as 2 hours; at times only, maxstay:conditional."
    parking_orientation: "How cars stand: parallel to the kerb, diagonal or perpendicular (parking:<side>:orientation)."
    parking_private: "Who the parking is kept for when only permit holders may park (parking:<side>:private), such as residents."
    parking_reason: "Why there is no parking, or why it is restricted (parking:<side>:reason, parking:<side>:restriction:reason): a narrow road, a bus stop, a junction…"
    parking_restriction: "No parking, no stopping or no standing at any time, loading only or charging only (parking:<side>:restriction). With no parking on the side, Lane Studio draws it as UK no-waiting lines: double yellow, or double red for no stopping."
    parking_staggered: "Cars park on alternate sides of a narrow road, so traffic weaves between them (parking:<side>:staggered=yes)."
    parking_surface: "The parking's own surface, where it differs from the road's (parking:<side>:surface)."
    parking_times: "A value that applies at times only, written as value @ (times) in opening hours syntax, such as no_parking @ (Mo-Sa 08:00-18:30). A single yellow line is no waiting at times."
    parking_width: "How deep the parking is, in metres (parking:<side>:width), where it is not the usual width."
    parking_zone: "The parking zone's letter or number on permits and signs (parking:<side>:zone)."
    position: "Moves the lane left or right among the lanes going its way, as its drivers see them, keeping its tags."
    road_marking: "Painted markings mapped as features of their own (road_marking=*): lines, areas and text, with their stroke, colour and pattern. Hatching or chevrons between lanes are an area, road_marking=restriction with pattern=stripes or chevron; the lanes part round it."
    roundabout: "A roundabout's ring (junction=roundabout): the ring's segments and the roads joining it."
    shoulder: "A hard shoulder beside the lanes (shoulder=*, or shoulder:left and shoulder:right). Motorways are drawn with one until the road says otherwise."
    shoulder_width: "How wide the hard shoulder is, in metres (shoulder:<side>:width); drawn 2.5 m wide until tagged."
    sidewalk: "Pavements along the road, per side (sidewalk:left, sidewalk:right, sidewalk:both): yes, no, mapped separately as a way of its own, or lane for a pedestrian lane painted on the road. sidewalk:<side>:surface and sidewalk:<side>:kerb are drawn too."
    sign: "Which sign this is (traffic_sign=*), such as GB:670[40] for a 40 mph limit. UK signs are drawn as their pictures; several on one post are separated by semicolons."
    sign_direction: "The compass bearing the sign faces (direction=*), towards the traffic that reads it."
    sign_tool: "Pick a sign, a message sign or a camera, then click a lane: it is placed beside the road, facing that lane's traffic."
    sign_value: "The number on the sign, written in its code's brackets or, for a speed limit, as the node's maxspeed."
    street_parking: "Parking mapped as an area of its own (amenity=parking with parking=street_side, lane, layby, on_kerb or half_on_kerb), joined to the road beside it."
    surface: "The lane's own surface (surface:lanes), where it differs from the road's."
    tools: "Select edits lanes; Paint applies one value to many lanes; Width drags lane widths; Markings and Signs place features on the road; Connect links a lane to the lanes it leads to across a junction."
    turbo: "A turbo roundabout (roundabout=turbo with change:lanes=no) keeps traffic in its lane round the ring. Tag every ring segment."
    turn: "The arrows painted on the lane (turn:lanes): left, through, right, slight and sharp turns, U-turn and merges, several per lane separated by semicolons."
    variable_speed: "Signs can lower the speed limit (maxspeed:variable=*); the limit tagged is the highest it can be. The reasons, if known, are listed in the value."
    width: "The lane's width in metres (width:lanes); drawn with the usual UK widths until tagged."
